<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="build" content="pony-pals-v1.0">
<title>Pony Pals: My Little Stable</title>
<meta name="description" content="A gentle pony care game for little ones. Feed, brush, ride and tuck in your pony.">
<meta name="theme-color" content="#ffc2dc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pony Pals">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="needs">
      <button class="need" data-need="hunger" aria-label="hungry"><span class="in" data-ico="apple"></span></button>
      <button class="need" data-need="clean" aria-label="clean"><span class="in" data-ico="drop"></span></button>
      <button class="need" data-need="fun" aria-label="fun"><span class="in" data-ico="ball"></span></button>
    </div>
    <button id="shoes" class="chip" aria-label="horseshoes"><span data-ico="shoe"></span><span id="shoeCount">0</span></button>
    <button id="parentBtn" aria-label="Grown-ups: hold for 3 seconds"><span data-ico="lock"></span></button>
  </header>
  <main id="stage">
    <div class="beam"></div>
    <div class="win"><svg viewBox="0 0 100 80">
      <rect x="4" y="4" width="92" height="72" rx="6" fill="#141a4a"/>
      <circle cx="70" cy="24" r="9" fill="#fef9c3"/><circle cx="66" cy="21" r="8" fill="#141a4a"/>
      <g fill="#fff"><circle cx="20" cy="18" r="1.4"/><circle cx="40" cy="12" r="1"/><circle cx="34" cy="30" r="1.2"/><circle cx="84" cy="44" r="1"/><circle cx="16" cy="40" r="1"/></g>
      <g class="day"><rect x="4" y="4" width="92" height="72" rx="6" fill="#8fd8ff"/><circle cx="74" cy="22" r="10" fill="#fde047"/>
        <g fill="#fff"><circle cx="24" cy="22" r="7"/><circle cx="32" cy="20" r="9"/><circle cx="40" cy="23" r="6"/></g>
        <path d="M4 60Q30 40 56 56T96 50V76H4Z" fill="#86efac"/></g>
      <path d="M50 4V76M4 40H96" stroke="#7c4a1e" stroke-width="5"/>
      <rect x="4" y="4" width="92" height="72" rx="6" fill="none" stroke="#7c4a1e" stroke-width="7"/>
      <rect x="0" y="72" width="100" height="8" rx="3" fill="#7c4a1e"/>
    </svg></div>
    <div class="wallshoe" data-ico="shoe"></div>
    <div class="deco bunting"><svg viewBox="0 0 400 50" preserveAspectRatio="none"><path d="M0 4Q200 30 400 4" fill="none" stroke="#7c2d12" stroke-width="2"/>
      <g stroke-width="1.5"><path d="M20 8l8 26 9-24z" fill="#f472b6" stroke="#9d174d"/><path d="M70 13l8 26 9-24z" fill="#60a5fa" stroke="#1e3a8a"/><path d="M120 16l8 26 9-25z" fill="#facc15" stroke="#a16207"/><path d="M170 17l8 26 9-25z" fill="#4ade80" stroke="#166534"/><path d="M220 17l9 25 8-26z" fill="#c084fc" stroke="#6b21a8"/><path d="M270 15l9 25 8-26z" fill="#f472b6" stroke="#9d174d"/><path d="M320 12l9 25 8-26z" fill="#60a5fa" stroke="#1e3a8a"/><path d="M366 8l9 25 8-26z" fill="#facc15" stroke="#a16207"/></g></svg></div>
    <div class="deco lights"><svg viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 4Q200 34 400 4" fill="none" stroke="#334155" stroke-width="1.5"/>
      <g stroke="#334155" stroke-width="1"><circle cx="30" cy="12" r="5" fill="#fde047"/><circle cx="80" cy="18" r="5" fill="#f472b6"/><circle cx="130" cy="22" r="5" fill="#60a5fa"/><circle cx="180" cy="24" r="5" fill="#4ade80"/><circle cx="230" cy="24" r="5" fill="#fde047"/><circle cx="280" cy="21" r="5" fill="#f472b6"/><circle cx="330" cy="16" r="5" fill="#60a5fa"/><circle cx="375" cy="10" r="5" fill="#4ade80"/></g></svg></div>
    <div class="lanternHang" id="lantern"><div class="rope"></div><span data-ico="lantern"></span><div class="glow"></div></div>
    <div class="floor"></div>
    <div class="hay"><svg viewBox="0 0 120 74"><rect x="4" y="6" width="112" height="64" rx="12" fill="#eab308" stroke="#92400e" stroke-width="4"/>
      <path d="M14 20h30M54 16h40M20 34h60M30 50h70M12 60h26M86 30h22" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
      <path d="M38 6v64M84 6v64" stroke="#b45309" stroke-width="5"/></svg></div>
    <div class="deco flowers" data-ico="flowers"></div>
    <div id="bucket"><svg viewBox="0 0 80 70"><path d="M8 18h64l-8 48H16z" fill="#60a5fa" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round"/><path d="M10 30h60" stroke="#1e3a8a" stroke-width="3"/><ellipse cx="40" cy="18" rx="32" ry="7" fill="#eab308" stroke="#1e3a8a" stroke-width="4"/><path d="M10 18C10 -4 70 -4 70 18" fill="none" stroke="#475569" stroke-width="3"/></svg></div>
    <div class="friend" id="foal"></div>
    <div class="friend" id="bunny"></div>
    <div id="ponyWrap"></div>
    <div id="shade"></div>
    <div id="fx"></div>
    <div id="brushCursor" data-ico="brush"></div>
  </main>
  <nav id="bar"></nav>
</div>

<div id="setup" class="overlay"></div>
<div id="shop" class="overlay"></div>
<div id="celebrate" class="overlay"></div>
<div id="parent" class="overlay"></div>
<div id="sleepy" class="overlay"></div>
<div id="play" class="overlay">
  <canvas id="playCanvas"></canvas>
  <div id="rider"></div>
  <button class="topbtn" id="playHome" aria-label="home"><span data-ico="home"></span></button>
  <div class="count" id="playCount"></div>
  <div class="tapHint" id="tapHint" data-ico="tap"></div>
  <div class="finish" id="finish"></div>
</div>
<div id="toastWord"></div>
<noscript>Pony Pals needs JavaScript turned on.</noscript>
<script src="js/art.js?v=1.0"></script>
<script src="js/audio.js?v=1.0"></script>
<script src="js/game.js?v=1.0"></script>
</body>
</html>
